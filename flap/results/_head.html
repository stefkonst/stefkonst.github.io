<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results</title>
<meta name="description" content="B-cube, a flapping robot with an all-DEA wing: main findings in six figures, conclusions and open tests.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--ink:#14171a;--paper:#f5f6f4;--rule:#d3d8dc;--accent:#1f64b5;--accent-dim:#dce7f5;--muted:#5d646b;--card:#fff;--warn:#9a5b00;--warnbg:#fff4e0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e7eaec;--paper:#15181b;--rule:#33393f;--accent:#6aa5ea;--accent-dim:#1d2c3e;--muted:#9aa2a9;--card:#1d2125;--warn:#ffcc80;--warnbg:#3a2c12}}
:root[data-theme="dark"]{--ink:#e7eaec;--paper:#15181b;--rule:#33393f;--accent:#6aa5ea;--accent-dim:#1d2c3e;--muted:#9aa2a9;--card:#1d2125;--warn:#ffcc80;--warnbg:#3a2c12}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 .5em}
h2{font-size:22px} h3{font-size:17px;margin-top:16px}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:36px 16px}
.lead{font-size:18px;max-width:820px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;font-size:11px}
svg text.h{fill:#c8440a;font-weight:600}
.fig img,.plotrow>img{width:100%;border:1px solid var(--rule);border-radius:8px;background:#fff}
.tw{overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
tr.main td{font-weight:600}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14.5px;margin-bottom:18px}
.note{font-size:13.5px;color:var(--muted)}
ul,ol{padding-left:20px;margin:.4em 0} li{margin:.3em 0}
ul.read{font-size:14.5px;margin-top:10px}
.eq{overflow-x:auto;margin:6px 0 10px;position:relative}
.katex{position:relative}
.row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start;border-top:1px solid var(--rule);padding:14px 0}
@media (max-width:820px){.row{grid-template-columns:minmax(0,1fr)}}
.row p{margin:.2em 0 .5em}
.step{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:17px;margin:0 0 4px}
nav.toc{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin:8px 0 18px}
.go{display:block;text-decoration:none;color:inherit;border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.go:hover{border-color:var(--accent)} .go b{color:var(--accent)}
.plotrow{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:14px;align-items:start}
.plotrow>img{min-width:0}
@media (max-width:820px){.plotrow{grid-template-columns:minmax(0,1fr)}.ps{max-width:380px}}
.pcard{--ps-hi:#c8440a}
.pcard svg text.h{fill:var(--ps-hi);font-weight:600}
.ps{--ps-hi:#c8440a;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.4;background:var(--card)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ps,:root:not([data-theme="light"]) .pcard{--ps-hi:#f08a55}}
:root[data-theme="dark"] .ps,:root[data-theme="dark"] .pcard{--ps-hi:#f08a55}
.ps svg{width:100%;height:auto;display:block;margin-bottom:6px}
.ps svg text{fill:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;font-size:10.5px}
.ps svg text.h{fill:var(--ps-hi);font-weight:600}
.ps svg text.m{fill:var(--muted)}
.ps p{margin:.25em 0;color:var(--ink);font-size:12.5px}
.ps b{color:var(--ps-hi)}
.ps p+p b{color:var(--muted)}
.disc{font-size:15.5px;line-height:1.6;margin:12px 0 14px;max-width:880px}
</style>
