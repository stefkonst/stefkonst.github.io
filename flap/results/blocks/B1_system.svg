xt x="608.0" y="304.0" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start" opacity="1">17 Hz at 0 V (edge ≈ 4 mN)</text><text x="608.0" y="320.9" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start" opacity="1">≈ 10 Hz when the edge is slack</text><text x="608.0" y="337.8" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start" opacity="1">q″ + 2ζ_wω_w q′ + ω_w² q = −θ″</text><rect x="906" y="160" width="7" height="120" rx="3.5" fill="#0d9488"/><text x="928.0" y="190.0" font-size="13.5" fill="#0f172a" font-weight="600" text-anchor="start" opacity="1">Video</text><text x="928.0" y="214.0" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start" opacity="1">leading-edge angle</text><text x="928.0" y="230.9" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start" opacity="1">θ + q, 200 fps</text><line x1="227.0" y1="160.0" x2="282.0" y2="145.0" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ahA)" /><line x1="227.0" y1="190.0" x2="282.0" y2="300.0" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ahA)" /><line x1="517.0" y1="145.0" x2="582.0" y2="140.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)" /><text x="530.0" y="132.0" font-size="11.5" fill="#64748b" font-weight="600" text-anchor="start" opacity="1" font-style="italic">u(t)</text><line x1="517.0" y1="315.0" x2="582.0" y2="320.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)" /><text x="533.0" y="306.0" font-size="11.5" fill="#64748b" font-weight="600" text-anchor="start" opacity="1" font-style="italic">T</text><line x1="680.0" y1="212.0" x2="680.0" y2="246.0" stroke="#750014" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahM)" /><line x1="742.0" y1="246.0" x2="742.0" y2="212.0" stroke="#750014" stroke-width="2.8" stroke-linecap="round" marker-end="url(#ahM)" /><text x="626.0" y="235.0" font-size="12.5" 