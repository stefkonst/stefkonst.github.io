<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dadou26</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;800&family=Caveat:wght@600&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf3ea; --ink:#3a1f1a; --soft:#8a6a5e; --card:#fffaf4; --line:#ead8c6;
  --accent:#d2582a; --accent2:#b23a48; --gold:#e9a23b; --shadow:0 10px 30px rgba(90,40,20,.15);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1214; --ink:#f6e7dc; --soft:#c2a497; --card:#2a1a1d; --line:#46302f;
    --accent:#f08a4b; --accent2:#e0607a; --gold:#f2b65a; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#1d1214; --ink:#f6e7dc; --soft:#c2a497; --card:#2a1a1d; --line:#46302f;
  --accent:#f08a4b; --accent2:#e0607a; --gold:#f2b65a; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;
  background-image:radial-gradient(circle at 15% 0%, rgba(233,162,59,.18), transparent 40%),
                   radial-gradient(circle at 100% 30%, rgba(178,58,72,.12), transparent 40%);
  min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;margin:6px 0 18px}
header .kicker{font-family:Caveat,cursive;font-size:1.6rem;color:var(--accent2);line-height:1}
header h1{font-family:Fraunces,serif;font-weight:700;font-size:clamp(1.9rem,5vw,2.8rem);margin:.1em 0 .15em;letter-spacing:-.01em}
header p{margin:0 auto;max-width:560px;color:var(--soft)}
#status{margin:14px auto 0;display:inline-block;padding:8px 16px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-weight:700;box-shadow:var(--shadow)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.board{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.viewport{position:relative;overflow:auto;border-radius:10px;-webkit-overflow-scrolling:touch;max-height:min(80vh,720px);background:#fff;touch-action:pan-x pan-y}
#cv{display:block;width:100%;height:auto;cursor:crosshair;image-rendering:auto}
.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  padding:8px 14px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.zoom{display:flex;gap:6px}
.zoom .btn{width:40px;padding:8px 0}
.side h2{font-family:Fraunces,serif;font-size:1.2rem;margin:4px 0 10px}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:820px){.pal{grid-template-columns:repeat(8,1fr)}}
@media (max-width:480px){.pal{grid-template-columns:repeat(6,1fr)}}
.pot{position:relative;aspect-ratio:1;border-radius:50%;border:3px solid var(--card);outline:1px solid var(--line);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;
  transition:transform .15s, outline-color .15s;padding:0;font-family:inherit}
.pot:hover{transform:scale(1.06)}
.pot.sel{outline:3px solid var(--ink);transform:scale(1.1)}
.pot.locked{background:repeating-linear-gradient(45deg,var(--line),var(--line) 4px,var(--card) 4px,var(--card) 8px)!important;
  color:var(--soft)!important;cursor:not-allowed}
.pot.locked::after{content:"🔒";position:absolute;font-size:.7rem;bottom:-4px;right:-4px}
.pot.done::after{content:"♥";position:absolute;font-size:.85rem;top:-6px;right:-4px;color:var(--accent2);
  background:var(--card);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.pot.today{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}
.info{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px dashed var(--line);font-size:.95rem}
.info b{color:var(--accent)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent),var(--accent2));width:0;transition:width .4s}
.gifts{margin-top:18px}
.gifts ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.gifts li button{width:100%;text-align:left;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.gifts li button:hover{border-color:var(--accent)}
.gifts .d{font-family:Fraunces,serif;font-weight:700;color:var(--accent);min-width:2.2em}
.empty{color:var(--soft);font-size:.92rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:700;transition:transform .25s,opacity .25s;opacity:0;z-index:30;max-width:calc(100vw - 32px);text-align:center}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,10,10,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.card{position:relative;width:min(440px,100%);background:var(--card);color:var(--ink);border-radius:20px;padding:26px 24px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.card .day{font-family:Caveat,cursive;font-size:1.5rem;color:var(--accent2)}
.card h3{font-family:Fraunces,serif;font-size:1.8rem;margin:.1em 0 .4em;line-height:1.1}
.card p{margin:.4em 0;line-height:1.5}
.card .close{margin-top:16px}
.card .swatch{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;border:4px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.coupon{border:2px dashed var(--accent);border-radius:16px;padding:16px 24px;margin-top:8px;position:relative;
  background:linear-gradient(135deg,rgba(233,162,59,.12),rgba(178,58,72,.10))}
.coupon::before,.coupon::after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--card);
  transform:translateY(-50%);border:2px dashed var(--accent)}
.coupon::before{left:-13px;border-left-color:transparent;border-bottom-color:transparent;transform:translateY(-50%) rotate(45deg)}
.coupon::after{right:-13px;border-right-color:transparent;border-top-color:transparent;transform:translateY(-50%) rotate(45deg)}
.coupon .bp{letter-spacing:.3em;font-weight:800;font-size:.75rem;color:var(--accent)}
.coupon .sig{font-family:Caveat,cursive;font-size:1.35rem;color:var(--accent2);margin-top:8px}
.coupon .meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--soft);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.clue{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-weight:700}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;font-size:24px;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(var(--r));opacity:0}}
.reveal{margin-top:12px}
.yes{font-family:Caveat,cursive;font-size:2.3rem;color:var(--accent2);margin:40px 0 0}
.oui{position:relative;display:inline-block}
.oui svg{position:absolute;left:-4px;right:-4px;top:30%;width:calc(100% + 8px);height:45%;overflow:visible}
.oui path{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:70;stroke-dashoffset:70;animation:strike .5s .6s ease-out forwards}
.oui .what{position:absolute;left:50%;bottom:72%;transform:translateX(-45%) rotate(-9deg);font-family:"Reenie Beanie",cursive;
  font-size:2.3rem;color:#2f5fa8;white-space:nowrap;opacity:0;animation:scrawl .4s 1.1s ease-out forwards}
@keyframes strike{to{stroke-dashoffset:0}}
@keyframes scrawl{from{opacity:0;transform:translateX(-45%) rotate(-9deg) scale(.7)}to{opacity:1;transform:translateX(-45%) rotate(-9deg)}}
footer{text-align:center;color:var(--soft);margin-top:30px;font-family:Caveat,cursive;font-size:1.4rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">pour mon Dadou ♥</div>
    <h1>Calendrier de l'Avent 2026</h1>
    <p>Chaque jour, une nouvelle couleur. Peins toutes les cases de son numéro et ton cadeau du jour apparaîtra. Le 24, le tableau sera complet.</p>
    <div id="status">…</div>
  </header>

  <div class="main">
    <section class="board" id="board">
      <div class="viewport" id="vp"><canvas id="cv"></canvas></div>
      <div class="tools">
        <div class="zoom">
          <button class="btn" id="zout" aria-label="Dézoomer">−</button>
          <button class="btn" id="zin" aria-label="Zoomer">+</button>
        </div>
        <button class="btn" id="hint">✨ Où sont mes cases ?</button>
      </div>
    </section>

    <aside class="side">
      <div class="board">
        <h2>Ta palette</h2>
        <div class="pal" id="pal"></div>
        <div class="info" id="info"></div>
      </div>
      <div class="gifts board" style="margin-top:18px">
        <h2>Tes cadeaux</h2>
        <ul id="glist"></ul>
      </div>
    </aside>
  </div>
  <footer>Je t'aime, ta Stef</footer>
</div>

<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div id="toast"></div>
<div class="hearts" id="hearts"></div>

<script src="data.js"></script>
<script>
(() => {
const C = window.CAL, N = 24, S = C.size, YEAR = 2026;
const qs = new URLSearchParams(location.search);
const PREVIEW = qs.get('apercu') === 'etoile';          // secret preview: everything unlocked, nothing saved
const KEY = PREVIEW ? 'dadou26-preview' : 'dadou26-v1';
const SC = 2;                                            // canvas supersampling

// --- gifts (lightly hidden so a peek at the source doesn't spoil them)
const GIFTS = (() => {
  const k = new TextEncoder().encode('dadou-2026-advent');
  const b = Uint8Array.from(atob(C.g), c => c.charCodeAt(0)).map((v, i) => v ^ k[i % k.length]);
  return JSON.parse(new TextDecoder().decode(b));
})();

// --- state
let filled = new Set();
const store = {
  load(){ try{ const v = JSON.parse(localStorage.getItem(KEY) || '{}'); filled = new Set(v.f || []); }catch(e){} },
  save(){ if (PREVIEW) return; try{ localStorage.setItem(KEY, JSON.stringify({ f:[...filled] })); }catch(e){} }
};
store.load();

const regs = C.regions.map((r, i) => ({ id:i, day:r[0], x:r[1], y:r[2], rad:r[3] }));
const byDay = Array.from({length:N+1}, () => []);
regs.forEach(r => byDay[r.day].push(r));

const now = new Date();
function unlocked(d){ return PREVIEW || now >= new Date(YEAR, 11, d); }
function todayDay(){ return (now.getFullYear() === YEAR && now.getMonth() === 11) ? Math.min(now.getDate(), 24) : (now > new Date(YEAR, 11, 24) ? 24 : 0); }
function dayDone(d){ return byDay[d].every(r => filled.has(r.id)); }

// --- region map
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = cv.height = S * SC;
let ids, edge;
const fillLayer = document.createElement('canvas'); fillLayer.width = fillLayer.height = S;
const fctx = fillLayer.getContext('2d');
const hex = h => [1,3,5].map(i => parseInt(h.substr(i,2),16));
const PAL = C.palette.map(hex);

const img = new Image();
img.onload = () => {
  const t = document.createElement('canvas'); t.width = t.height = S;
  const tc = t.getContext('2d'); tc.drawImage(img, 0, 0);
  const px = tc.getImageData(0, 0, S, S).data;
  ids = new Int32Array(S*S);
  for (let i = 0; i < S*S; i++) ids[i] = px[i*4] + px[i*4+1]*256 - 1;
  edge = new Uint8Array(S*S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++){
    const i = y*S + x, v = ids[i];
    if ((x+1 < S && ids[i+1] !== v) || (y+1 < S && ids[i+S] !== v)) edge[i] = 1;
  }
  init();
};
img.src = 'regions.png';

let flash = null; // {day, t0}
function draw(){
  const im = fctx.createImageData(S, S), d = im.data;
  const fl = flash && (performance.now() - flash.t0 < 2400) ? flash : null;
  const pulse = fl ? 0.5 + 0.5*Math.sin((performance.now() - fl.t0)/120) : 0;
  for (let i = 0; i < S*S; i++){
    const r = regs[ids[i]]; let c;
    if (edge[i] && !(filled.has(r.id) && isInterior(i))) c = [150,128,118];
    else if (filled.has(r.id)) c = PAL[r.day-1];
    else if (fl && r.day === fl.day) c = mix([255,255,255], PAL[r.day-1], 0.25 + 0.55*pulse);
    else c = [255,255,255];
    d[i*4] = c[0]; d[i*4+1] = c[1]; d[i*4+2] = c[2]; d[i*4+3] = 255;
  }
  fctx.putImageData(im, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(fillLayer, 0, 0, S*SC, S*SC);
  // numbers
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const r of regs){
    if (filled.has(r.id)) continue;
    const fs = Math.max(10, Math.min(26, r.rad * 1.1)) * SC;
    ctx.font = `800 ${fs}px Nunito, sans-serif`;
    ctx.fillStyle = unlocked(r.day) ? '#6d5149' : '#c2b2aa';
    ctx.fillText(r.day, r.x*SC, r.y*SC + fs*0.05);
  }
  if (fl) requestAnimationFrame(draw); else flash = null;
}
function mix(a, b, t){ return a.map((v, k) => Math.round(v + (b[k]-v)*t)); }
// outline only where at least one side is still unpainted (finished areas look like a real painting)
function isInterior(i){
  const v = ids[i], x = i % S;
  const n = [x+1<S ? ids[i+1] : v, i+S<S*S ? ids[i+S] : v];
  return n.every(o => o === v || filled.has(o));
}

// --- palette
const pal = document.getElementById('pal');
let sel = 0;
function lum([r,g,b]){ return 0.299*r + 0.587*g + 0.114*b; }
function buildPalette(){
  pal.innerHTML = '';
  const td = todayDay();
  for (let d = 1; d <= N; d++){
    const b = document.createElement('button');
    b.className = 'pot' + (unlocked(d) ? '' : ' locked') + (dayDone(d) ? ' done' : '') + (d === sel ? ' sel' : '') + (d === td && !dayDone(d) && !PREVIEW ? ' today' : '');
    b.textContent = d;
    b.style.background = C.palette[d-1];
    b.style.color = lum(PAL[d-1]) > 150 ? '#3a1f1a' : '#fff';
    b.title = unlocked(d) ? `Couleur n°${d}` : `Disponible le ${d} décembre`;
    b.onclick = () => {
      if (!unlocked(d)) return toast(`Patience… la couleur ${d} arrive le ${d} décembre 🎄`);
      sel = d; buildPalette(); updateInfo();
    };
    pal.appendChild(b);
  }
}
function updateInfo(){
  const info = document.getElementById('info');
  if (!sel){ info.innerHTML = 'Choisis une couleur débloquée dans la palette, puis touche les cases qui portent son numéro.'; return; }
  const tot = byDay[sel].length, f = byDay[sel].filter(r => filled.has(r.id)).length;
  info.innerHTML = dayDone(sel)
    ? `Couleur <b>n°${sel}</b> terminée ♥ <button class="btn" style="margin-top:8px;padding:4px 12px" id="reopen">Revoir le cadeau</button>`
    : `Couleur <b>n°${sel}</b> : ${f} / ${tot} case${tot>1?'s':''} peinte${f>1?'s':''}<div class="bar"><i style="width:${100*f/tot}%"></i></div>`;
  const ro = document.getElementById('reopen'); if (ro) ro.onclick = () => showGift(sel);
}
function updateStatus(){
  const td = todayDay(), el = document.getElementById('status');
  const done = Array.from({length:N}, (_, i) => i+1).filter(dayDone).length;
  if (PREVIEW) el.textContent = `Mode aperçu : tout est débloqué, rien n'est sauvegardé`;
  else if (td === 0){
    const days = Math.ceil((new Date(YEAR, 11, 1) - now) / 864e5);
    el.textContent = `Ouverture dans ${days} jour${days>1?'s':''} ✨ Rendez-vous le 1er décembre`;
  } else if (done === N) el.textContent = `Tableau terminé ♥ Joyeux Noël mon amour`;
  else el.textContent = `${done} / 24 cadeaux ouverts · couleur du jour : n°${td}`;
}
function buildGiftList(){
  const ul = document.getElementById('glist'); ul.innerHTML = '';
  let any = false;
  for (let d = 1; d <= N; d++){
    if (!dayDone(d)) continue; any = true;
    const li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = `<span class="d">${d} déc</span><span>${esc(GIFTS[d-1].title)}</span>`;
    b.onclick = () => showGift(d);
    li.appendChild(b); ul.appendChild(li);
  }
  if (all24()){
    const li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = `<span class="d">♥</span><span>Voir la vraie photo</span>`;
    b.onclick = showPhoto; li.appendChild(b); ul.appendChild(li);
  }
  if (!any) ul.innerHTML = '<li class="empty">Ils apparaîtront ici au fur et à mesure.</li>';
}
const all24 = () => Array.from({length:N}, (_, i) => i+1).every(dayDone);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// --- painting
function canvasPoint(e){
  const r = cv.getBoundingClientRect();
  return [Math.floor((e.clientX - r.left) / r.width * S), Math.floor((e.clientY - r.top) / r.height * S)];
}
cv.addEventListener('click', e => {
  const [x, y] = canvasPoint(e);
  if (x < 0 || y < 0 || x >= S || y >= S) return;
  let reg = regs[ids[y*S + x]];
  if (!sel){ toast('Choisis d\'abord une couleur dans la palette 🎨'); return; }
  if (filled.has(reg.id) && reg.day !== sel) return;
  if (reg.day !== sel){
    // forgiving tap: look for a matching unfilled region nearby
    const R = Math.max(6, Math.round(14 * S / cv.getBoundingClientRect().width));
    let best = null, bd = 1e9;
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++){
      const xx = x+dx, yy = y+dy; if (xx<0||yy<0||xx>=S||yy>=S) continue;
      const o = regs[ids[yy*S+xx]], dd = dx*dx + dy*dy;
      if (o.day === sel && !filled.has(o.id) && dd < bd){ bd = dd; best = o; }
    }
    if (!best){
      document.getElementById('board').classList.remove('shake'); void cv.offsetWidth;
      document.getElementById('board').classList.add('shake');
      return toast(unlocked(reg.day) ? `Cette case attend la couleur n°${reg.day}` : `Cette case attend la couleur n°${reg.day} (le ${reg.day} déc)`);
    }
    reg = best;
  }
  if (filled.has(reg.id)) return;
  filled.add(reg.id); store.save(); draw(); updateInfo();
  if (dayDone(sel)){
    setTimeout(() => { showGift(sel); buildPalette(); buildGiftList(); updateStatus(); }, 350);
  }
});

document.getElementById('hint').onclick = () => {
  if (!sel) return toast('Choisis d\'abord une couleur 🎨');
  if (dayDone(sel)) return toast('Cette couleur est déjà terminée ♥');
  flash = { day: sel, t0: performance.now() }; draw();
};
let zoom = 1;
function setZoom(z){
  const vp = document.getElementById('vp');
  const cx = (vp.scrollLeft + vp.clientWidth/2) / vp.scrollWidth, cy = (vp.scrollTop + vp.clientHeight/2) / vp.scrollHeight;
  zoom = Math.max(1, Math.min(4, z)); cv.style.width = (100*zoom) + '%';
  vp.scrollLeft = cx*vp.scrollWidth - vp.clientWidth/2; vp.scrollTop = cy*vp.scrollHeight - vp.clientHeight/2;
}
document.getElementById('zin').onclick = () => setZoom(zoom * 1.5);
document.getElementById('zout').onclick = () => setZoom(zoom / 1.5);

// --- gift popup
const modal = document.getElementById('modal'), card = document.getElementById('card');
function showGift(d){
  const g = GIFTS[d-1];
  const body = g.type === 'bon'
    ? `<div class="coupon"><div class="bp">BON POUR</div><h3>${esc(g.title)}</h3><p>${esc(g.text)}</p>
         <div class="sig">avec tout mon amour, Stef ♥</div>
         <div class="meta"><span>N° ${String(d).padStart(2,'0')} / 24</span><span>Valable : pour toujours</span></div></div>`
    : `<h3>${esc(g.title)}</h3><p>${esc(g.text)}</p>${g.clue ? `<div class="clue">🔎 Indice : ${esc(g.clue)}</div>` : ''}`;
  card.innerHTML = `<div class="swatch" style="background:${C.palette[d-1]}"></div>
    <div class="day">${d} décembre</div>${body}
    ${d === 24 && all24() ? '<div class="reveal"><button class="btn" id="ph">Voir la vraie photo ♥</button></div>' : ''}
    <button class="btn primary close" id="cl">Merci ♥</button>`;
  modal.classList.add('on'); hearts();
  document.getElementById('cl').onclick = () => modal.classList.remove('on');
  const ph = document.getElementById('ph'); if (ph) ph.onclick = showPhoto;
}
function showPhoto(){
  card.innerHTML = `<img src="photo.jpg" alt="Notre photo" style="width:100%;border-radius:12px;display:block">
    <p class="yes">Le plus beau <span class="oui">oui<svg viewBox="0 0 60 20" preserveAspectRatio="none" aria-hidden="true"><path d="M2 13 C 14 9, 26 12, 36 9 S 52 8, 58 7"/></svg><span class="what">what</span></span> ♥</p>
    <button class="btn primary close" id="cl">Fermer</button>`;
  modal.classList.add('on'); hearts();
  document.getElementById('cl').onclick = () => modal.classList.remove('on');
}
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('on'); });
function hearts(){
  const h = document.getElementById('hearts');
  for (let i = 0; i < 26; i++){
    const s = document.createElement('span');
    s.textContent = ['♥','❤','✨','🎁','♥'][i % 5];
    s.style.left = Math.random()*100 + 'vw';
    s.style.color = ['#d2582a','#b23a48','#e9a23b'][i % 3];
    s.style.fontSize = (16 + Math.random()*22) + 'px';
    s.style.setProperty('--r', (Math.random()*80 - 40) + 'deg');
    s.style.animationDuration = (2.4 + Math.random()*2) + 's';
    s.style.animationDelay = (Math.random()*0.6) + 's';
    h.appendChild(s); setTimeout(() => s.remove(), 5200);
  }
}
let tt;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }

function init(){
  const td = todayDay();
  if (td && !PREVIEW){
    // pre-select the earliest unlocked colour not finished yet
    for (let d = 1; d <= td; d++) if (!dayDone(d)){ sel = d; break; }
  }
  if (PREVIEW) sel = 1;
  buildPalette(); updateInfo(); updateStatus(); buildGiftList();
  document.fonts && document.fonts.ready.then(draw);
  draw();
}
})();
</script>
</body>
